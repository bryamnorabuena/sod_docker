name: Trigger auto deployment for api-sod-simple

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ dev ]
    paths:
    - '**'
    - '.github/workflows/api-sod-simple-AutoDeployTrigger-1faf1c5c-d904-48a7-941a-eac12e493ec1.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.APISODSIMPLE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.APISODSIMPLE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.APISODSIMPLE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.APISODSIMPLE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.APISODSIMPLE_REGISTRY_PASSWORD }}
          containerAppName: api-sod-simple
          resourceGroup: DefaultResourceGroup-WUS2
          imageToBuild: ghcr.io/api-sod-simple:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


